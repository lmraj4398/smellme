# Example nginx site for SmellMe behind pm2: /etc/nginx/sites-available/smellme (symlink into sites-enabled).
# HTTPS: run `sudo certbot --nginx -d smellme.in -d www.smellme.in` afterwards; it adds the 443 block and the redirect.
# One origin serves everything: / (storefront), /admin (admin panel), /api (API).
server {
  listen 80;
  server_name smellme.in www.smellme.in;

  client_max_body_size 10m;   # receipt / product image uploads

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # the API rate-limits per client IP from this
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
